name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*' # Triggers when a new version tag (e.g., v7.0.0) is pushed
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        # Build natively on both Windows and MacOS to avoid NSIS/cross-compilation errors
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run electron:build -- --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron App (Mac)
        if: matrix.os == 'macos-latest'
        run: npm run electron:build -- --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
